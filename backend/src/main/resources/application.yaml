server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  workspace-invitations:
    expiration-days: ${WORKSPACE_INVITATION_EXPIRATION_DAYS:7}

spring:
  application:
    name: api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:micro_approval_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:dev_user}
    password: ${DB_PASS:dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate # BẮT BUỘC LÀ VALIDATE: Ép hệ thống dùng Flyway, không cho Hibernate tự sửa bảng
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      chat: ${AI_PROVIDER:openai}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:}
        chat:
          options:
            model: ${GOOGLE_GENAI_MODEL:gemini-2.5-flash}

rule-engine:
  max-cards-per-session: ${RULE_ENGINE_MAX_CARDS_PER_SESSION:10}

ai:
  analysis:
    enabled: ${AI_ANALYSIS_ENABLED:true}
    max-cards-per-session: ${AI_ANALYSIS_MAX_CARDS_PER_SESSION:10}
  credentials:
    # Required before a user can save an AI key. Generate once: openssl rand -base64 32
    encryption-key: ${AI_CREDENTIAL_ENCRYPTION_KEY:}

jwt:
  secret: ${JWT_SECRET:super_secret_key_for_micro_approval_project_123456}
  expiration: 86400000 # 24 giờ
