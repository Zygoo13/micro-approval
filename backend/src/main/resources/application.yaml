server:
  port: 8080

spring:
  application:
    name: api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:micro_approval_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:dev_user}
    password: ${DB_PASS:dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate # BẮT BUỘC LÀ VALIDATE: Ép hệ thống dùng Flyway, không cho Hibernate tự sửa bảng
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

jwt:
  secret: ${JWT_SECRET:super_secret_key_for_micro_approval_project_123456}
  expiration: 86400000 # 24 giờ
