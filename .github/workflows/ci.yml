name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Run backend tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit high-severity dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-quality
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: micro-approval-ci
      MYSQL_DATABASE: micro_approval_ci
      MYSQL_USER: micro_approval_ci
      MYSQL_PASSWORD: ci-only-not-a-production-password
      MYSQL_ROOT_PASSWORD: ci-only-not-a-production-root-password
      MYSQL_HOST_PORT: "33306"
      JWT_SECRET: ci-only-jwt-secret-do-not-use-outside-github-actions
      AI_CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AI_ANALYSIS_ENABLED: "false"
      FRONTEND_PORT: "3000"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Docker
        run: docker info

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start disposable stack
        run: docker compose up -d --wait --wait-timeout 240

      - name: Verify stack and HTTP routes
        run: |
          docker compose ps
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:3000/ > /dev/null
          status="$(curl --silent --show-error --output /tmp/backend-smoke.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"ci-smoke@example.com","password":"ci-smoke-invalid-password"}' \
            http://127.0.0.1:3000/gateway/v1/auth/login)"
          test "$status" = "401"

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop disposable stack
        if: always()
        run: docker compose down -v --remove-orphans
